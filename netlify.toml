# netlify.toml

[build]
  command = "NEXT_DISABLE_ESLINT=1 npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production.environment]
  NODE_ENV = "production"
  NEXTAUTH_URL = "https://alluracare.netlify.app"

[context.deploy-preview.environment]
  NODE_ENV = "preview"
  NEXTAUTH_URL = "https://preview--alluracare.netlify.app"